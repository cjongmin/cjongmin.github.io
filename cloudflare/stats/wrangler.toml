# Statistics for cjmin.me: one Worker and one D1 database. Deploy from this folder: npx wrangler deploy
# The owner's key is a secret, set once with: npx wrangler secret put STATS_KEY
name = "cjmin-stats"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [
  { pattern = "cjmin.me/api/v", zone_name = "cjmin.me" },
  { pattern = "cjmin.me/stats", zone_name = "cjmin.me" },
  { pattern = "cjmin.me/stats/*", zone_name = "cjmin.me" },
]
rules = [{ type = "Text", globs = ["**/*.html", "**/*.txt"], fallthrough = false }]

[[d1_databases]]
binding = "DB"
database_name = "cjmin-stats"
database_id = "0b19a640-e489-47ba-9568-485ad90bb8c6"
